name: MLops Pipeline
on:
  workflow_dispatch:
    inputs:
      run_all:
        description: 'Run all jobs'
        required: false
        default: 'true'
      run_data_processing:
        description: 'Run data processing jobs'
        required: false
        default: 'false'
      run_model_training:
        description: 'Run model training jobs'
        required: false
        default: 'false'
      run_build_and_push:
        description: 'Run build and push jobs'
        required: false
        default: 'false'
    release:
      types: [created]
      branches: [ "main" ]
      tags: [ "v*.*.*" ]

jobs:
  data_processing:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Set up Python 3.13.5
        uses: actions/setup-python@v5
        with:
          python-version: 3.13.5

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      
      - name: Process Data
        run: |
          python src/data/run_processing.py --input data/raw/house_data.csv --output data/processed/cleaned_house_data.csv

      - name: Engineer Features
        run: |
          python src/features/engineer.py \
            --input data/processed/cleaned_house_data.csv \
            --output data/processed/featured_house_data.csv \
            --preprocessor models/trained/preprocessor.pkl

      - name: Upload Processed Data
        uses: actions/upload-artifact@v4
        with:
          name: processed-data
          path: data/processed/featured_house_data.csv

      - name: Upload Preprocessor
        uses: actions/upload-artifact@v4
        with:
          name: preprocessor
          path: models/trained/preprocessor.pkl

  model_training:
    runs-on: ubuntu-latest
    needs: data_processing
    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Set up Python 3.13.5
        uses: actions/setup-python@v5
        with:
          python-version: 3.13.5

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Download Processed Data
        uses: actions/download-artifact@v4
        with:
          name: processed-data
          path: data/processed/

      - name: Setup mlflow server
        run: |
          docker pull ghcr.io/mlflow/mlflow:latest
          docker run -d -p 5555:5000 --name mlflow-server ghcr.io/mlflow/mlflow:latest  \
            mlflow server --host 0.0.0.0 --backend-store-uri sqlite:///mlflow.db

      - name: Wait for mlflow server to be ready
        run: |
          for i in {1..10}; do
            curl -f http://localhost:5555/health || sleep 5;
          done
     
      - name: Train Model
        run: |
          python src/models/train_model.py \
            --config configs/model_config.yaml \
            --data data/processed/featured_house_data.csv \
            --models-dir models \
            --mlflow-tracking-uri http://localhost:5555

      - name: Upload Trained Model
        uses: actions/upload-artifact@v4
        with:
          name: trained-model
          path: models/

      - name: Cleaning mlflow server
        run: |
          docker stop mlflow-server || true
          docker rm mlflow-server || true


  build-and-publish:
    runs-on: ubuntu-latest
    needs: model_training
    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Set up Python 3.13.5
        uses: actions/setup-python@v5
        with:
          python-version: 3.13.5

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Download Trained Model
        uses: actions/download-artifact@v4
        with:
          name: trained-model
          path: models/

       - name: Download Preprocessor
        uses: actions/download-artifact@v4
        with:
          name: preprocessor
          path: models/trained/


      - name: Build and test docker image
        run: |
          COMMIT_SHA=$(echo ${{ github.sha }} | cut -c1-7)
          docker build -t docker.io/${{ var.DOCKER_USERNAME }}/house-price-predictor:${COMMIT_SHA} -f Dockerfile .
          docker run -d -p 8000:8000 --name test-api docker.io/${{ var.DOCKER_USERNAME }}/house-price-predictor:${COMMIT_SHA} 
          for i in {1..10}; do
            curl -f http://localhost:8000/health || sleep 5;
          done
          docker logs test-api

      - name: Cleanup test docker container
        run: |
          docker stop test-api || true
          docker rm test-api || true

      - name: Login to DockerHub Registry
        uses: docker/login-action@v3
        with:
          registry: docker.io
          username: ${{ vars.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_TOKEN }}

      - name: Push Docker Image to DockerHub
        run: |
          COMMIT_SHA=$(echo ${{ github.sha }} | cut -c1-7)
          docker tag docker.io/${{ vars.DOCKER_USERNAME }}/house-price-predictor:${COMMIT_SHA} docker.io/${{ vars.DOCKER_USERNAME }}/house-price-predictor:latest
          docker push docker.io/${{ vars.DOCKER_USERNAME }}/house-price-predictor:${COMMIT_SHA}
          docker push docker.io/${{ vars.DOCKER_USERNAME }}/house-price-predictor:latest

          